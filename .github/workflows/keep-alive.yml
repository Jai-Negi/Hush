# Pings the backend every 10 minutes so Render's free tier never spins it
# down (cold starts take ~1 minute — bad mid-demo). Staying warm 24/7 uses
# ~720 instance hours/month, inside Render's 750 free hours.
# Set the repository *variable* BACKEND_URL, e.g. https://hush-api.onrender.com

name: Keep backend awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "BACKEND_URL repository variable is not set — skipping."
            exit 0
          fi
          curl -fsS --max-time 90 "$BACKEND_URL/health"
